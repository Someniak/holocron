# Holocron GitLab CI entrypoint. The actual job definitions live under
# .gitlab/ci/ -- keeping this root file a thin include means no project setting
# (Settings -> CI/CD -> CI/CD configuration file) has to change.
#
#   .gitlab/ci/github-status.yml  .github-check wrapper: report results to GitHub
#   .gitlab/ci/test.yml           pytest + PyPI smoke test (mirrors GitHub CI)
#   .gitlab/ci/build.yml          Kaniko container image build/push (manual)

# Run pipelines for merge requests, branch pushes, and tags -- but never a
# duplicate branch pipeline when the branch has an open MR. Holocron mirrors
# with `git push --mirror` (branches only, no MRs), so the branch rule is what
# gives the GitLab copy per-push test coverage.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - test
  - build

include:
  - local: .gitlab/ci/github-status.yml
  - local: .gitlab/ci/test.yml
  - local: .gitlab/ci/build.yml
