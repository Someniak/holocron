[project]
name = "holocron-sync"
version = "1.1.5"
description = "Holocron: The Ultimate Git Mirroring Tool"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "python-dotenv",
]

[project.scripts]
holocron = "holocron.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/holocron"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-requests>=2.31.0",
]

[tool.pytest.ini_options]
pythonpath = "src"
norecursedirs = ["mirror-data", ".venv", ".git"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",     # line too long (handled by formatter)
    "UP007",    # use X | Y for union types (need 3.9 compat)
]

[tool.ruff.lint.isort]
known-first-party = ["holocron"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
