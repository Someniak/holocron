# GitLab CI: run the same checks the GitHub Actions CI runs
# (.github/workflows/ci.yaml) so the mirrored GitLab copy gates on identical
# tests -- the pytest suite and a PyPI package smoke test. The Dockerfile build
# smoke test is covered by the `docker-build` (Kaniko --no-push) job in
# build.yml.
#
# Image: the astral-sh uv image ships uv + CPython (Python 3.14, like the GitHub
# job). uv only publishes 3.14 on trixie (full Debian 13), alpine, and dhi --
# there is no -slim variant for 3.14 -- so use trixie. The runners only allow
# images under artifactory.aparty.blue-yard.be/**, so it is pulled via ProGet,
# which proxies and caches ghcr.io/astral-sh/uv on first request (same pattern
# as the Kaniko image in build.yml).
.uv:
  image: artifactory.aparty.blue-yard.be/containers/astral-sh/uv:0.11.29-python3.14-trixie
  # Run on merge requests and branch pushes, but NOT on tags: a tag points at a
  # commit already tested by its branch pipeline, so re-testing it just double-
  # runs the suite (a release commit is both a branch tip and a tag). The tag
  # pipeline is left to docker-publish alone.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# Seed a "pending" GitHub status for every auto-running check as soon as the
# pipeline starts, so all checks appear on the PR up front instead of trickling
# in as each job begins (a commit status can only be posted by a running job,
# and `needs` ordering otherwise staggers them). Runs first in the built-in
# .pre stage. Does NOT extend .github-check (it seeds other jobs' contexts, not
# its own). Keep the context list below in sync with the reporting job names.
seed-github-status:
  extends: .uv
  stage: .pre
  script:
    - |
      [ -n "$GITHUB_REPO" ] && [ -n "$GITHUB_STATUS_TOKEN" ] || exit 0
      for ctx in unit-tests smoke-pypi; do
        GH_URL="https://api.github.com/repos/$GITHUB_REPO/statuses/$CI_COMMIT_SHA" \
        GH_BODY="{\"state\":\"pending\",\"context\":\"ci/gitlab/$ctx\",\"target_url\":\"$CI_PIPELINE_URL\"}" \
        GH_TOKEN="$GITHUB_STATUS_TOKEN" python3 -c 'import os,urllib.request; urllib.request.urlopen(urllib.request.Request(os.environ["GH_URL"], data=os.environ["GH_BODY"].encode(), method="POST", headers={"Authorization":"token "+os.environ["GH_TOKEN"], "Content-Type":"application/json", "User-Agent":"gitlab-ci-github-status"}), timeout=15)' >/dev/null 2>&1 || true
      done

# Mirrors the "Run Tests" job: install all extras + dev deps, run pytest.
unit-tests:
  extends:
    - .uv
    - .github-check
  stage: test
  script:
    - uv sync --all-extras --dev
    - uv run pytest

# Mirrors the "Smoke Test (PyPI Release)" job: build the wheel, install it into
# a clean venv, and confirm the console script runs.
smoke-pypi:
  extends:
    - .uv
    - .github-check
  stage: test
  needs: ["unit-tests"]
  script:
    - uv build
    - uv venv smoke-test-env
    - . smoke-test-env/bin/activate
    - uv pip install dist/*.whl
    - holocron --help
    - holocron --version
