# GitLab CI: build the container image on GitLab runners and push it to
# Artifactory. This complements the GitHub Actions release (which publishes to
# GHCR) so the mirrored GitLab copy produces its own images.
#
# Builder: Kaniko (rootless, no Docker daemon / privileged runner required).
# `docker-build` (--no-push) is a manual Dockerfile smoke test on merge requests
# (a play button in the MR pipeline). `docker-publish` builds and pushes to
# Artifactory automatically on default-branch commits and on mirrored tags.
#
# Every job extends .github-check (see github-status.yml) so its result is
# reported back to the mirrored GitHub commit when GITHUB_REPO /
# GITHUB_STATUS_TOKEN are configured.
#
# Required CI/CD variables (Settings -> CI/CD -> Variables; mark USER/TOKEN as
# masked, and protect them if you only build protected branches/tags):
#
#   ARTIFACTORY_REGISTRY  Docker registry host only, e.g. mycompany.jfrog.io
#   ARTIFACTORY_IMAGE     Full image path WITHOUT a tag, e.g.
#                         mycompany.jfrog.io/docker-local/holocron
#   ARTIFACTORY_USER      Artifactory username or service account
#   ARTIFACTORY_TOKEN     Artifactory API token or password (masked)
#
# Note: the Dockerfile pulls python:3.14-alpine (docker.io) and
# ghcr.io/astral-sh/uv (ghcr.io). The runners must be able to reach those, or
# you can proxy them through Artifactory remote repositories and adjust the
# base-image references in the Dockerfile.

# Validate the required variables and write Kaniko's registry auth. Kept in the
# job `script` (not before_script) so it does not clash with the .github-check
# before_script hook. Shared between jobs via a YAML anchor.
.kaniko-auth: &kaniko-auth |
  for v in ARTIFACTORY_REGISTRY ARTIFACTORY_IMAGE ARTIFACTORY_USER ARTIFACTORY_TOKEN; do
    eval "val=\$$v"
    if [ -z "$val" ]; then
      echo "ERROR: required CI/CD variable $v is not set."
      exit 1
    fi
  done
  mkdir -p /kaniko/.docker
  AUTH=$(printf '%s:%s' "$ARTIFACTORY_USER" "$ARTIFACTORY_TOKEN" | base64 | tr -d '\n')
  printf '{"auths":{"%s":{"auth":"%s"}}}' "$ARTIFACTORY_REGISTRY" "$AUTH" > /kaniko/.docker/config.json

.container-build:
  stage: build
  # The Dockerfile's base images are pulled through the ProGet mirror because the
  # runners have no public-registry egress. These --build-arg overrides replace
  # the Dockerfile's public defaults (which the GitHub Actions build still uses)
  # only here. Verify the python path resolves against your feed's docker.io
  # connector -- some ProGet setups omit the `library/` segment.
  variables:
    KANIKO_BASE_ARGS: "--build-arg PYTHON_IMAGE=artifactory.aparty.blue-yard.be/containers/library/python:3.14-alpine --build-arg UV_IMAGE=artifactory.aparty.blue-yard.be/containers/astral-sh/uv:0.10.10"
  image:
    # Pulled via ProGet (artifactory.aparty.blue-yard.be), which proxies and
    # caches gcr.io/kaniko-project/executor on first request.
    name: artifactory.aparty.blue-yard.be/containers/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]

# Merge requests: build only, to validate the Dockerfile without publishing.
# Manual: start it from the MR pipeline / Pipelines view when you want it.
# No *kaniko-auth: --no-push needs no registry credentials, so this runs on
# unprotected MR branches without the (protected) ARTIFACTORY_* variables.
docker-build:
  extends:
    - .container-build
    - .github-check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/Dockerfile" $KANIKO_BASE_ARGS --no-push

# Default branch and tags: build and push to Artifactory, automatically.
# Tags are mirrored from GitHub (git push --mirror), so cutting a GitHub release
# publishes the matching Artifactory image here with no manual step. The
# `&& $ARTIFACTORY_IMAGE` guard means the job only exists when Artifactory is
# configured -- otherwise it is skipped, not failed.
#
# `environment: artifactory` records each publish under Operate -> Environments
# (deployment history) and lets you scope the push creds to that environment.
# Mark ARTIFACTORY_USER / ARTIFACTORY_TOKEN as Protected + Masked so they are
# only injected on protected branches/tags; protect the release tags (e.g. v*)
# too, or a tag pipeline runs without creds and fails.
docker-publish:
  extends:
    - .container-build
    - .github-check
  environment:
    name: artifactory
    url: https://artifactory.aparty.blue-yard.be
  rules:
    - if: '$CI_COMMIT_TAG && $ARTIFACTORY_IMAGE'
      variables:
        KANIKO_DESTINATIONS: "--destination $ARTIFACTORY_IMAGE:$CI_COMMIT_TAG --destination $ARTIFACTORY_IMAGE:latest"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $ARTIFACTORY_IMAGE'
      variables:
        KANIKO_DESTINATIONS: "--destination $ARTIFACTORY_IMAGE:latest --destination $ARTIFACTORY_IMAGE:$CI_COMMIT_SHORT_SHA"
  script:
    - *kaniko-auth
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/Dockerfile" $KANIKO_BASE_ARGS $KANIKO_DESTINATIONS
