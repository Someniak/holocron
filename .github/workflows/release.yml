name: Release

# CHANGELOG-driven release (99feathers model).
#
# Flow:
#   1. Run /release on a branch: it promotes `## Unreleased` in CHANGELOG.md to
#      `## vX.Y.Z - YYYY-MM-DD` and bumps the version in pyproject.toml and
#      src/holocron/config.py to match. Open a PR and merge it to main.
#   2. Dispatch this workflow (Actions -> Release -> Run workflow). No inputs:
#      the version is read from the top versioned heading in CHANGELOG.md.
#
# This workflow owns tagging and publishing. Never tag by hand.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Tag and Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read version from CHANGELOG
        id: version
        run: |
          # The first versioned heading below `## Unreleased`.
          VERSION=$(grep -m1 -oE '^## v[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.]*' CHANGELOG.md | sed 's/^## v//')
          if [ -z "$VERSION" ]; then
            echo "::error::No prepared release found in CHANGELOG.md. Run /release to promote '## Unreleased' to '## vX.Y.Z' first."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ [A-Za-z] ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Release version: $VERSION"

      - name: Validate version sources are in sync
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PY=$(grep -m1 '^version = ' pyproject.toml | cut -d '"' -f2)
          CFG=$(grep -m1 '^__version__ = ' src/holocron/config.py | cut -d '"' -f2)
          if [ "$PY" != "$VERSION" ]; then
            echo "::error::pyproject.toml version ($PY) does not match CHANGELOG version ($VERSION). Bump it during release prep."
            exit 1
          fi
          if [ "$CFG" != "$VERSION" ]; then
            echo "::error::src/holocron/config.py __version__ ($CFG) does not match CHANGELOG version ($VERSION). Bump it during release prep."
            exit 1
          fi

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v hdr="## v$VERSION" '
            index($0, hdr) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          echo "----- release notes -----"
          cat RELEASE_NOTES.md

      - name: Create and push tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Nothing new was prepared; run /release first."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          body_path: RELEASE_NOTES.md
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          draft: false

  pypi-publish:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/holocron-sync
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: "v${{ needs.release.outputs.version }}"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.10"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  docker-publish:
    name: Publish Docker Image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: "v${{ needs.release.outputs.version }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release.outputs.version }}
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=latest,enable=${{ needs.release.outputs.is_prerelease == 'false' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
